[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sd-connect-s3-migrate-cli"
dynamic = ["version"]
description = "CLI tool for converting SD Connect buckets, access control and objects to an S3 compatible format."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "CSC Developers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "aioboto3==15.5.0",
    "aiobotocore==2.25.1",
    "aiohttp==3.14.5",
    "asyncstdlib==3.14.0",
    "boto3==1.40.61",
    "botocore==1.40.61",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "click==8.5.0",
    "crypt4gh==1.8.6",
    "cryptography==50.0.2",
    "sd-lock-utility @ git+https://github.com/CSCfi/sd-lock-util.git@a97e4e3888344d52973c7b6b66856cfa15e424c6",
    "types-aiobotocore-s3==2.26.0",
    "anyascii==0.3.3",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
test = [
    "black==26.10.1",
    "flake8-docstrings==1.7.0",
    "flake8==7.5.0",
    "mypy==1.20.2",
    "tox==4.67.12",
]
dev = [
    "pre-commit==3.8.0",
    "ruff==0.17.4",
    "types-aiofiles==23.2.0.20240623",
]
build = [
    "pyinstaller==6.22.3",
]

[project.scripts]
sd-connect-s3-migrate-cli = "sd_connect_s3_migrate_cli.cli:wrap"
sd-connect-s3-convert = "sd_connect_s3_migrate_cli.cli:convert"

[project.urls]
Source = "https://github.com/CSCfi/sd-connect-s3-migrate"
Documentation = "https://docs.csc.fi/data/sensitive-data"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "sd_connect_s3_migrate_cli/__init__.py"

[tool.black]
line-length = 90
target-version = ['py312']

[tool.isort]
atomic = true
profile = "black"
line_length = 90
py_version=312

[tool.ruff]
line-length = 90
target-version = "py312"

# https://beta.ruff.rs/docs/rules/
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    # "ANN",   # flake8-annotations
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "D",   # pydocstyle
#    "UP",  # pyupgrade
    "S",   # Bandit
]
ignore = [
    "ANN101",  # Missing type annotation for `self` in method
    "E501",    # line too long, handled by black
    "B904",    # do not perform function calls in argument defaults
    "PLR2004", # magic value used in comparison
    "S113",    # Probable use of requests call without timeout
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
]

[tool.ruff.lint.mccabe]
max-complexity = 60

[tool.hatch.build.targets.wheel]
packages = ["sd_connect_s3_migrate_cli"]

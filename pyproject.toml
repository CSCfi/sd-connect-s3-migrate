[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sd-connect-s3-migrate-cli"
dynamic = ["version"]
description = "CLI tool for converting SD Connect buckets, access control and objects to an S3 compatible format."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "CSC Developers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "aioboto3==13.1.1",
    "aiobotocore==2.13.1",
    "aiohttp==3.9.5",
    "asyncstdlib==3.13.1",
    "boto3==1.34.131",
    "botocore==1.34.131",
    "certifi==2025.1.31",
    "cffi==2.0.0",
    "click==8.1.7",
    "crypt4gh==1.6",
    "cryptography==48.0.0",
    "sd-lock-utility @ git+https://github.com/CSCfi/sd-lock-util.git@8ed6fe7d1ec3e5f34ed9d0405a9df334765eb8f8",
    "types-aiobotocore-s3==2.25.0",
    "anyascii==0.3.3",
    "tqdm==4.68.4",
]

[project.optional-dependencies]
test = [
    "black==24.4.2",
    "flake8-docstrings==1.7.0",
    "flake8==7.0.0",
    "mypy==1.10.0",
    "tox==4.15.0",
]
dev = [
    "pre-commit==3.7.1",
    "ruff==0.4.4",
    "types-aiofiles==23.2.0.20240403",
]
build = [
    "pyinstaller==6.22.0",
]

[project.scripts]
sd-connect-s3-migrate-cli = "sd_connect_s3_migrate_cli.cli:wrap"
sd-connect-s3-convert = "sd_connect_s3_migrate_cli.cli:convert"

[project.urls]
Source = "https://github.com/CSCfi/sd-connect-s3-migrate"
Documentation = "https://docs.csc.fi/data/sensitive-data"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "sd_connect_s3_migrate_cli/__init__.py"

[tool.black]
line-length = 90
target-version = ['py312']

[tool.isort]
atomic = true
profile = "black"
line_length = 90
py_version=312

[tool.ruff]
line-length = 90
target-version = "py312"

# https://beta.ruff.rs/docs/rules/
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    # "ANN",   # flake8-annotations
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "D",   # pydocstyle
#    "UP",  # pyupgrade
    "S",   # Bandit
]
ignore = [
    "ANN101",  # Missing type annotation for `self` in method
    "E501",    # line too long, handled by black
    "B904",    # do not perform function calls in argument defaults
    "PLR2004", # magic value used in comparison
    "S113",    # Probable use of requests call without timeout
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.hatch.build.targets.wheel]
packages = ["sd_connect_s3_migrate_cli"]
